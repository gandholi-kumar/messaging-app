<div class="container mt-4">
  <ng-container *ngIf="notification$ | async as notification">
    <ng-container *appHideAfter="3000">
      <h2 class="text-success">{{notification}}</h2>
    </ng-container>
  </ng-container>

  <app-table [posts]="displayedPosts" [currentUser]="currentUser$ | async" [users]="users"></app-table>

  <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (onPreviousPageClick)="prevPage()"
    (onNextPageClick)="nextPage()"></app-pagination>
</div>
